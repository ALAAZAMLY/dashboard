<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Agent Dashboard</title>
<style>
:root{--bg:#f6f7fb;--cd:#fff;--tx:#1b1f2a;--mu:#667085;--bd:#e4e7ec;--pr:#4f46e5;--ok:#12805c;--wa:#b54708;--er:#c0262d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--cd:#181c25;--tx:#e8ebf2;--mu:#9aa3b5;--bd:#2a3040;--pr:#818cf8;--ok:#4ade80;--wa:#fbbf24;--er:#f87171}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
nav{position:fixed;z-index:5;background:var(--cd);border:solid var(--bd);display:flex;gap:2px}
nav button{background:none;border:0;color:var(--mu);padding:10px 12px;font:inherit;cursor:pointer;border-radius:8px;white-space:nowrap;text-align:left}
nav button.on{background:var(--pr);color:#fff}
@media(max-width:800px){nav{bottom:0;left:0;right:0;border-width:1px 0 0;overflow-x:auto;padding:4px}main{padding:16px 14px 80px}}
@media(min-width:801px){nav{top:0;left:0;bottom:0;width:190px;flex-direction:column;border-width:0 1px 0 0;padding:14px 8px}main{margin-left:190px;padding:28px 32px;max-width:1050px}}
h1{margin:0 0 4px;font-size:22px}h2{font-size:16px;margin:0 0 8px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat b{display:block;font-size:28px}
label{display:block;margin:12px 0 4px;font-weight:600}input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto;margin-right:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}
button.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}button.g{background:none;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--er)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bd)}
.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}.box{border-left:4px solid var(--wa);padding:10px 14px;background:var(--cd);border-radius:8px;margin:12px 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
#toasts{position:fixed;top:12px;right:12px;left:12px;z-index:9;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.t{background:var(--cd);border:1px solid var(--bd);border-left:5px solid var(--ok);padding:10px 14px;border-radius:8px;box-shadow:0 4px 14px #0003;max-width:420px}.t.wa{border-left-color:var(--wa)}.t.er{border-left-color:var(--er)}
ol{padding-left:20px}a{color:var(--pr)}
</style></head><body>
<nav id="nav"></nav><main id="main"></main><div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.13/dist/browsers/sodium.js"></script>
<script>
const FILES={"job_agent.py": "#!/usr/bin/env python3\n\"\"\"Autonomous job application agent for Alaa Mohsen. See README.txt.\"\"\"\nimport csv, html, json, os, re, subprocess, sys, urllib.parse, urllib.request\nimport xml.etree.ElementTree as ET\nfrom datetime import datetime, timedelta, timezone\nfrom email.utils import parsedate_to_datetime\n\nROOT = os.path.dirname(os.path.abspath(__file__))\ndef P(n): return os.path.join(ROOT, n)\n\n# ---------------- CONFIG ----------------\nEGP_PER_USD = 50\nMIN_EGP_ABROAD = 50_000          # monthly floor, jobs paid from outside Egypt\nMIN_EGP_EGYPT = 25_000           # monthly floor, jobs in Egypt\nMIN_SCORE = 70                   # AI match score needed before applying\nMAX_AGE_DAYS = 7\nMAX_YEARS_REQUIRED = 3\nMAX_LLM_EVALS = 40               # job evaluations per run (cost control)\nMAX_APPLY_PER_RUN = 10           # per hourly run\nMAX_APPLY_PER_DAY = 20           # hard daily ceiling (Cairo time); the goal is 10-20, never padding\nMAX_MANUAL_PER_RUN = 5\nMAX_MANUAL_PER_DAY = 15           # limits Telegram 'needs attention' noise\nDRY_RUN = os.getenv(\"DRY_RUN\", \"true\").lower() != \"false\"   # fills forms but does not submit\nMODEL = \"claude-sonnet-5-5\"\nTITLE_KEYWORDS = [\"ui/ux\", \"ux/ui\", \"ui / ux\", \"ui designer\", \"ux designer\", \"web designer\",\n                  \"user experience designer\", \"user interface designer\", \"cro designer\", \"ecommerce designer\"]\nTITLE_EXCLUDE = [\"senior\", \"sr\", \"lead\", \"principal\", \"manager\", \"head\", \"director\", \"staff\", \"intern\",\n                 \"internship\", \"product designer\", \"graphic\", \"motion\", \"3d\", \"part-time\", \"part time\", \"unpaid\"]\n# ----------------------------------------\n\nPROFILE = json.load(open(P(\"profile.json\"), encoding=\"utf-8\"))\nCOMPANIES = json.load(open(P(\"companies.json\"), encoding=\"utf-8\"))\n\ndef _load(name, default):\n    try: return json.load(open(P(name), encoding=\"utf-8\"))\n    except Exception: return default\nSETTINGS = _load(\"settings.json\", {})      # written by the dashboard\nJOBS, STATS = _load(\"jobs_log.json\", []), _load(\"stats.json\", {})\ndef _s(k, d): return SETTINGS.get(k, d)\nMIN_SCORE, MAX_AGE_DAYS = _s(\"min_score\", MIN_SCORE), _s(\"max_age_days\", MAX_AGE_DAYS)\nMAX_YEARS_REQUIRED = _s(\"max_years\", MAX_YEARS_REQUIRED)\nMAX_APPLY_PER_RUN, MAX_APPLY_PER_DAY = _s(\"max_apply_per_run\", MAX_APPLY_PER_RUN), _s(\"max_apply_per_day\", MAX_APPLY_PER_DAY)\nEGP_PER_USD, MIN_EGP_ABROAD, MIN_EGP_EGYPT = _s(\"egp_per_usd\", EGP_PER_USD), _s(\"min_egp_abroad\", MIN_EGP_ABROAD), _s(\"min_egp_egypt\", MIN_EGP_EGYPT)\nTITLE_KEYWORDS, TITLE_EXCLUDE = _s(\"titles_include\", TITLE_KEYWORDS), _s(\"titles_exclude\", TITLE_EXCLUDE)\nDRY_RUN = _s(\"mode\", \"test\") != \"live\"      # \"test\" = fill forms but do not submit\nif \"companies\" in SETTINGS: COMPANIES = SETTINGS[\"companies\"]\nUA = {\"User-Agent\": \"Mozilla/5.0 (personal job application assistant)\"}\nSEEN_FILE, LOG_FILE = P(\"seen.json\"), P(\"applications_log.csv\")\nATS_RE = re.compile(r\"https?://(?:boards|job-boards)\\.greenhouse\\.io/[\\w\\-]+/jobs/\\d+|\"\n                    r\"https?://jobs\\.lever\\.co/[\\w\\-]+/[0-9a-f\\-]{36}\", re.I)\n\ndef get(url, timeout=30):\n    with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=timeout) as r:\n        return r.read()\n\ndef strip(t):\n    t = html.unescape(t or \"\")\n    return re.sub(r\"\\s+\", \" \", html.unescape(re.sub(r\"<[^>]+>\", \" \", t))).strip()\n\ndef parse_dt(v):\n    if not v: return None\n    try:\n        if isinstance(v, (int, float)):\n            d = datetime.fromtimestamp(v / 1000 if v > 1e11 else v, tz=timezone.utc)\n        else:\n            try: d = parsedate_to_datetime(str(v))\n            except Exception: d = datetime.fromisoformat(str(v).replace(\"Z\", \"+00:00\"))\n        return d if d.tzinfo else d.replace(tzinfo=timezone.utc)\n    except Exception:\n        return None\n\n# ---------------- discovery ----------------\ndef src_greenhouse():\n    for t in COMPANIES.get(\"greenhouse\", []):\n        try: data = json.loads(get(f\"https://boards-api.greenhouse.io/v1/boards/{t}/jobs?content=true\"))\n        except Exception: continue\n        for j in data.get(\"jobs\", []):\n            yield dict(url=j[\"absolute_url\"], apply_url=j[\"absolute_url\"], title=j[\"title\"],\n                       company=j.get(\"company_name\") or t, desc=strip(j.get(\"content\", \"\"))[:3000],\n                       location=(j.get(\"location\") or {}).get(\"name\", \"\"),\n                       posted=parse_dt(j.get(\"first_published\") or j.get(\"updated_at\")), source=\"Greenhouse\")\n\ndef src_lever():\n    for c in COMPANIES.get(\"lever\", []):\n        try: data = json.loads(get(f\"https://api.lever.co/v0/postings/{c}?mode=json\"))\n        except Exception: continue\n        for j in data:\n            cat = j.get(\"categories\") or {}\n            loc = cat.get(\"location\", \"\") or \"\"\n            if j.get(\"workplaceType\") == \"remote\": loc = (loc + \" Remote\").strip()\n            yield dict(url=j[\"hostedUrl\"], apply_url=j.get(\"applyUrl\") or j[\"hostedUrl\"], title=j[\"text\"],\n                       company=c, desc=(j.get(\"descriptionPlain\") or \"\")[:3000], location=loc,\n                       posted=parse_dt(j.get(\"createdAt\")), source=\"Lever\")\n\ndef src_remoteok():\n    for j in json.loads(get(\"https://remoteok.com/api\"))[1:]:\n        yield dict(url=j.get(\"url\", \"\"), apply_url=j.get(\"apply_url\"), title=j.get(\"position\", \"\"),\n                   company=j.get(\"company\", \"\"), desc=strip(j.get(\"description\", \"\"))[:3000],\n                   location=j.get(\"location\") or \"Remote\", posted=parse_dt(j.get(\"epoch\") or j.get(\"date\")),\n                   sal_max=j.get(\"salary_max\") or 0, source=\"RemoteOK\")\n\ndef src_remotive():\n    for j in json.loads(get(\"https://remotive.com/api/remote-jobs?category=design\")).get(\"jobs\", []):\n        yield dict(url=j[\"url\"], apply_url=None, title=j[\"title\"], company=j[\"company_name\"],\n                   desc=strip(j.get(\"description\", \"\"))[:3000],\n                   location=j.get(\"candidate_required_location\") or \"Worldwide\",\n                   posted=parse_dt(j.get(\"publication_date\")), sal_text=j.get(\"salary\", \"\"), source=\"Remotive\")\n\ndef src_wwr():\n    root = ET.fromstring(get(\"https://weworkremotely.com/categories/remote-design-jobs.rss\"))\n    for it in root.iter(\"item\"):\n        company, _, title = it.findtext(\"title\", \"\").partition(\": \")\n        yield dict(url=it.findtext(\"link\", \"\"), apply_url=None, title=title, company=company,\n                   desc=strip(it.findtext(\"description\", \"\"))[:3000], location=it.findtext(\"region\", \"\") or \"Remote\",\n                   posted=parse_dt(it.findtext(\"pubDate\")), source=\"WeWorkRemotely\")\n\nSOURCES = [src_greenhouse, src_lever, src_remoteok, src_remotive, src_wwr]\n\ndef resolve_apply_url(j):\n    \"\"\"Aggregator listings: look for the real Greenhouse/Lever application link.\"\"\"\n    for u in [x for x in (j.get(\"apply_url\"), j[\"url\"]) if x]:\n        try:\n            with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=25) as r:\n                final, body = r.geturl(), r.read(400000).decode(\"utf-8\", \"ignore\")\n            m = ATS_RE.search(final) or ATS_RE.search(body)\n            if m: return m.group(0)\n        except Exception:\n            pass\n    return j.get(\"apply_url\") or j[\"url\"]\n\ndef ats_of(url):\n    return \"greenhouse\" if \"greenhouse.io\" in url else \"lever\" if \"jobs.lever.co\" in url else None\n\n# ---------------- filtering ----------------\ndef title_ok(t):\n    tl = t.lower()\n    return (any(k in tl for k in TITLE_KEYWORDS)\n            and not any(re.search(rf\"\\b{re.escape(x)}\\b\", tl) for x in TITLE_EXCLUDE))\n\ndef location_ok(loc, title=\"\"):\n    L = SETTINGS.get(\"locations\", {})\n    l, t = (loc or \"\").lower(), (title or \"\").lower()\n    if any(k in l for k in (\"egypt\", \"cairo\")):\n        kind = \"remote\" if \"remote\" in l + t else \"hybrid\" if \"hybrid\" in l + t else \"onsite\"\n        return L.get(\"egypt_\" + kind, True)\n    ww = L.get(\"worldwide_remote\", True)\n    if not l or any(k in l for k in [\"worldwide\", \"anywhere\", \"global\", \"emea\", \"mena\", \"middle east\", \"africa\"]): return ww\n    if any(k in l for k in [\"us only\", \"usa\", \"united states\", \"u.s.\", \"canada\", \"united kingdom\", \"uk only\", \"europe\",\n                            \"eu only\", \"north america\", \"latam\", \"latin america\", \"apac\", \"australia\", \"india\"]): return False\n    return \"remote\" in l and ww\n\ndef years_required(text):\n    ys = [int(m.group(1)) for m in re.finditer(r\"(\\d{1,2})\\s*\\+?\\s*(?:to|-)?\\s*\\d{0,2}\\s*\\+?\\s*years?[^.]{0,30}experience\", text.lower())]\n    return min(ys) if ys else None\n\ndef monthly_usd(j):\n    if j.get(\"sal_max\"): return j[\"sal_max\"] / 12\n    txt = j.get(\"sal_text\") or \"\"\n    nums = [float(n.replace(\",\", \"\")) for n in re.findall(r\"\\d[\\d,]*\\.?\\d*\", txt)]\n    if not nums or not re.search(r\"\\$|usd\", txt.lower()): return None\n    top = max(nums) * (1000 if \"k\" in txt.lower() and max(nums) < 1000 else 1)\n    return top / 12 if top > 20000 else top\n\ndef prefilter(j):\n    if not j.get(\"url\") or not title_ok(j[\"title\"]) or not location_ok(j[\"location\"], j[\"title\"]): return False\n    if j.get(\"posted\") and datetime.now(timezone.utc) - j[\"posted\"] > timedelta(days=MAX_AGE_DAYS): return False\n    y = years_required(j[\"desc\"])\n    if y and y > MAX_YEARS_REQUIRED: return False\n    sal = monthly_usd(j)\n    egypt = any(k in j[\"location\"].lower() for k in (\"egypt\", \"cairo\"))\n    floor = (MIN_EGP_EGYPT if egypt else MIN_EGP_ABROAD) / EGP_PER_USD\n    return sal is None or sal >= floor\n\n# ---------------- Claude ----------------\ndef claude(prompt, max_tokens=700):\n    body = json.dumps({\"model\": MODEL, \"max_tokens\": max_tokens,\n                       \"messages\": [{\"role\": \"user\", \"content\": prompt}]}).encode()\n    req = urllib.request.Request(\"https://api.anthropic.com/v1/messages\", data=body, headers={\n        \"x-api-key\": os.environ[\"ANTHROPIC_API_KEY\"], \"anthropic-version\": \"2023-06-01\",\n        \"content-type\": \"application/json\"})\n    with urllib.request.urlopen(req, timeout=90) as r:\n        return json.loads(r.read())[\"content\"][0][\"text\"].strip()\n\ndef llm_match(j):\n    p = f\"\"\"Evaluate how well this job fits the candidate. Return ONLY JSON:\n{{\"score\": 0-100, \"reason\": \"one sentence\", \"disqualify\": true/false}}\nSet disqualify=true if the role is not UI/UX design, requires more than 3 years of experience, requires skills,\nlanguages, location or work authorization the candidate does not have, or is an internship/unpaid.\nJudge only on the facts given; do not assume unlisted skills.\n\nCANDIDATE FACTS: {PROFILE['facts']}\n\nJOB: {j['title']} at {j['company']} ({j['location']})\n{j['desc'][:2500]}\"\"\"\n    try:\n        m = re.search(r\"\\{.*\\}\", claude(p, 300), re.S)\n        d = json.loads(m.group(0))\n        return (0 if d.get(\"disqualify\") else int(d.get(\"score\", 0))), d.get(\"reason\", \"\")\n    except Exception:\n        return 0, \"evaluation failed\"\n\ndef cover_letter(j):\n    p = f\"\"\"Write a tailored cover letter (130-180 words) from Alaa Mohsen for this role. Rules: use ONLY the facts\nbelow; never invent metrics, achievements, tools or experience; mention one relevant project (Petopia or Hello Fresh)\nand one relevant strength; say she is available to start immediately; plain professional tone, no cliches; end with\nher name and portfolio link. Output only the letter.\n\nFACTS: {PROFILE['facts']}\n\nJOB: {j['title']} at {j['company']}\n{j['desc'][:2000]}\"\"\"\n    return claude(p, 600)\n\ndef answer_question(label, j):\n    p = f\"\"\"Answer this job application question for the candidate using ONLY the facts below. If the facts do not\nclearly contain the answer, reply exactly UNKNOWN. Under 60 words, no preamble.\nQUESTION: {label}\nJOB: {j['title']} at {j['company']}\nFACTS: {PROFILE['facts']}\"\"\"\n    try:\n        a = claude(p, 250)\n        return None if a.upper().startswith(\"UNKNOWN\") else a\n    except Exception:\n        return None\n\n# ---------------- output ----------------\ndef telegram(text, kind=None):\n    kind = kind or (\"manual\" if text.startswith(\"NEEDS MANUAL\") else\n                    \"submitted\" if text.startswith((\"APPLICATION\", \"DRY RUN\")) else \"test\")\n    if not SETTINGS.get(\"telegram\", {}).get(kind, True): return\n    tok, chat = os.getenv(\"TELEGRAM_BOT_TOKEN\"), os.getenv(\"TELEGRAM_CHAT_ID\")\n    if not tok or not chat:\n        print(text, \"\\n\" + \"-\" * 60); return\n    for i in range(0, len(text), 3900):\n        data = urllib.parse.urlencode({\"chat_id\": chat, \"text\": text[i:i + 3900],\n                                       \"disable_web_page_preview\": \"true\"}).encode()\n        urllib.request.urlopen(urllib.request.Request(f\"https://api.telegram.org/bot{tok}/sendMessage\", data=data))\n\nCOLS = [\"Company\", \"Job Title\", \"Job URL\", \"Date\", \"Location\", \"Work Arrangement\", \"Source\",\n        \"Match Score\", \"Status\", \"Notes\"]\n\ntry:\n    from zoneinfo import ZoneInfo\n    CAIRO = ZoneInfo(\"Africa/Cairo\")\nexcept Exception:\n    CAIRO = timezone(timedelta(hours=2))\n\ndef today_str():\n    return datetime.now(CAIRO).strftime(\"%Y-%m-%d\")\n\ndef log(row):\n    new = not os.path.exists(LOG_FILE)\n    with open(LOG_FILE, \"a\", newline=\"\", encoding=\"utf-8\") as f:\n        w = csv.writer(f)\n        if new: w.writerow(COLS)\n        w.writerow(row)\n\ndef arrangement(j):\n    l = (j[\"location\"] + \" \" + j[\"title\"]).lower()\n    return \"Remote\" if any(k in l for k in (\"remote\", \"worldwide\", \"anywhere\", \"global\")) else \"Hybrid/On-site\"\n\n# ---------------- duplicate prevention ----------------\ndef canon(u):\n    return (u or \"\").split(\"#\")[0].split(\"?\")[0].rstrip(\"/\").lower()\n\ndef norm(s):\n    s = re.sub(r\"\\(.*?\\)|\\[.*?\\]\", \" \", (s or \"\").lower())\n    s = re.sub(r\"\\b(remote|worldwide|hybrid|full[- ]?time|contract|m/f/d|f/m/d)\\b\", \" \", s)\n    return re.sub(r\"[^a-z0-9]+\", \"\", s)\n\ndef job_key(j):\n    return norm(j.get(\"company\")) + \"|\" + norm(j.get(\"title\"))\n\ndef ats_id(url):\n    url = url or \"\"\n    m = re.search(r\"greenhouse\\.io/([\\w\\-]+)/jobs/(\\d+)\", url, re.I)\n    if m: return f\"gh:{m.group(1).lower()}/{m.group(2)}\"\n    m = re.search(r\"jobs\\.lever\\.co/([\\w\\-]+)/([0-9a-f\\-]{36})\", url, re.I)\n    if m: return f\"lever:{m.group(1).lower()}/{m.group(2).lower()}\"\n    return None\n\ndef load_state():\n    st = {\"urls\": set(), \"keys\": set(), \"ids\": set()}\n    if os.path.exists(SEEN_FILE):\n        d = json.load(open(SEEN_FILE, encoding=\"utf-8\"))\n        if isinstance(d, list):\n            st[\"urls\"] = {canon(u) for u in d}\n        else:\n            for k in st: st[k] = set(d.get(k, []))\n    if os.path.exists(LOG_FILE):  # rebuild from the log too, so history survives a lost seen.json\n        for r in csv.DictReader(open(LOG_FILE, encoding=\"utf-8\")):\n            u = r.get(\"Job URL\", \"\")\n            st[\"urls\"].add(canon(u))\n            st[\"keys\"].add(norm(r.get(\"Company\")) + \"|\" + norm(r.get(\"Job Title\")))\n            if ats_id(u): st[\"ids\"].add(ats_id(u))\n    return st\n\ndef is_dup(st, j):\n    urls = [canon(j.get(\"url\")), canon(j.get(\"apply_url\"))]\n    ids = [ats_id(j.get(\"url\")), ats_id(j.get(\"apply_url\"))]\n    return (any(u and u in st[\"urls\"] for u in urls) or job_key(j) in st[\"keys\"]\n            or any(i and i in st[\"ids\"] for i in ids))\n\ndef mark(st, j):\n    for u in (j.get(\"url\"), j.get(\"apply_url\")):\n        if u:\n            st[\"urls\"].add(canon(u))\n            if ats_id(u): st[\"ids\"].add(ats_id(u))\n    st[\"keys\"].add(job_key(j))\n\ndef record(j, outcome):\n    JOBS.append({\"date\": today_str(), \"title\": j[\"title\"], \"company\": j[\"company\"], \"location\": j[\"location\"],\n                 \"url\": j.get(\"apply_url\") or j[\"url\"], \"source\": j[\"source\"], \"score\": j.get(\"score\"),\n                 \"reason\": j.get(\"reason\", \"\"), \"outcome\": outcome})\n    STATS[\"reviewed\"] = STATS.get(\"reviewed\", 0) + 1\n\ndef save_state(st):\n    json.dump({k: sorted(v) for k, v in st.items()}, open(SEEN_FILE, \"w\"))\n    json.dump(JOBS[-600:], open(P(\"jobs_log.json\"), \"w\"))\n    json.dump(STATS, open(P(\"stats.json\"), \"w\"))\n\ndef checkpoint(st, msg):\n    \"\"\"Save history after EVERY application, so a crash or timeout can never cause a double application.\"\"\"\n    save_state(st)\n    if os.getenv(\"GITHUB_ACTIONS\"):\n        for cmd in ([\"git\", \"add\", \"seen.json\", \"applications_log.csv\", \"jobs_log.json\", \"stats.json\"],\n                    [\"git\", \"commit\", \"-m\", msg], [\"git\", \"pull\", \"--rebase\", \"--autostash\"], [\"git\", \"push\"]):\n            subprocess.run(cmd, cwd=ROOT, check=False, capture_output=True)\n\ndef counts_today():\n    a = m = 0\n    if os.path.exists(LOG_FILE):\n        for r in csv.DictReader(open(LOG_FILE, encoding=\"utf-8\")):\n            if r.get(\"Date\") == today_str():\n                if r.get(\"Status\") in (\"Submitted\", \"Dry Run\"): a += 1\n                elif r.get(\"Status\") == \"Needs Manual Action\": m += 1\n    return a, m\n\n_browser_ready = False\ndef ensure_browser():\n    global _browser_ready\n    if not _browser_ready:  # installed only when there is something to apply to (saves Actions minutes)\n        subprocess.run([sys.executable, \"-m\", \"playwright\", \"install\", \"--with-deps\", \"chromium\"], check=False)\n        _browser_ready = True\n\n# ---------------- main ----------------\ndef main():\n    if not os.getenv(\"ANTHROPIC_API_KEY\"):\n        sys.exit(\"ANTHROPIC_API_KEY is required (matching, cover letters and answers).\")\n    if SETTINGS.get(\"status\", \"stopped\") != \"running\":\n        print(\"Agent is paused or stopped in the dashboard.\"); return\n    STATS[\"last_run\"] = datetime.now(timezone.utc).isoformat()\n    st = load_state()\n    done_today, manual_today = counts_today()\n    if done_today >= MAX_APPLY_PER_DAY:\n        print(f\"Daily cap of {MAX_APPLY_PER_DAY} reached. Nothing to do.\"); save_state(st); return\n\n    pool, seen_run, keys_run = [], set(), set()\n    for src in SOURCES:   # direct company boards come first, so they win over aggregator copies\n        try:\n            for j in src():\n                u = canon(j.get(\"url\"))\n                if not u or u in seen_run or is_dup(st, j) or not prefilter(j): continue\n                k = job_key(j)\n                if k in keys_run: continue\n                seen_run.add(u); keys_run.add(k); pool.append(j)\n        except Exception as e:\n            print(f\"{src.__name__} failed: {e}\")\n    fallback = datetime.now(timezone.utc) - timedelta(days=3)\n    pool.sort(key=lambda x: x.get(\"posted\") or fallback, reverse=True)   # newest first\n    print(f\"{len(pool)} new jobs passed pre-filter (daily so far: {done_today}/{MAX_APPLY_PER_DAY})\")\n\n    from applier import apply_to_job\n    applied = manual = evals = 0\n    for j in pool:\n        if applied >= MAX_APPLY_PER_RUN or done_today + applied >= MAX_APPLY_PER_DAY or evals >= MAX_LLM_EVALS:\n            break\n        evals += 1\n        score, reason = llm_match(j)\n        j[\"score\"], j[\"reason\"] = score, reason\n        if score < MIN_SCORE:\n            mark(st, j); record(j, \"Below match score\"); continue\n        if not ats_of(j.get(\"apply_url\") or \"\"):\n            j[\"apply_url\"] = resolve_apply_url(j)\n        if canon(j[\"apply_url\"]) in st[\"urls\"] or (ats_id(j[\"apply_url\"]) in st[\"ids\"]):\n            mark(st, j); continue            # same job already handled via another board\n        mark(st, j)\n        today = today_str()\n        head = (f\"{j['title']} @ {j['company']}\\n{j['location']} | {arrangement(j)}\\n\"\n                f\"Match: {j['score']}/100 ({j['reason']})\\n{j['apply_url']}\\nDate: {today}\\n\")\n        can_notify = manual < MAX_MANUAL_PER_RUN and manual_today + manual < MAX_MANUAL_PER_DAY\n\n        def manual_case(note, letter=None):\n            nonlocal manual\n            if can_notify:\n                manual += 1\n                body = \"NEEDS MANUAL ACTION\\n\" + head + f\"Why: {note}\"\n                if letter: body += f\"\\n\\nDRAFT COVER LETTER:\\n{letter}\"\n                telegram(body)\n            else:\n                note += \" (notification skipped: manual-action limit reached, see the CSV)\"\n            log([j[\"company\"], j[\"title\"], j[\"apply_url\"], today, j[\"location\"], arrangement(j),\n                 j[\"source\"], j[\"score\"], (\"Failed\" if note.startswith((\"Automation error\", \"No confirmation\")) else \"Needs Manual Action\"), note])\n            record(j, \"Needs you\")\n\n        if not ats_of(j[\"apply_url\"]):\n            manual_case(\"Unsupported application site (login, CAPTCHA or custom flow)\")\n            checkpoint(st, \"history\"); continue\n\n        ensure_browser()\n        letter = cover_letter(j)\n        status, note = apply_to_job(j, PROFILE, P(PROFILE[\"cv_path\"]), letter,\n                                    answer_question, DRY_RUN, P(\"screenshots\"))\n        if status == \"submitted\":\n            applied += 1\n            telegram(\"APPLICATION SUBMITTED\\n\" + head + f\"Status: Submitted ({note})\\n\\nCOVER LETTER:\\n{letter}\")\n            log([j[\"company\"], j[\"title\"], j[\"apply_url\"], today, j[\"location\"], arrangement(j),\n                 j[\"source\"], j[\"score\"], \"Submitted\", note])\n            record(j, \"Applied\")\n        elif status == \"dry_run\":\n            applied += 1\n            telegram(\"DRY RUN: READY TO SUBMIT (nothing was sent)\\n\" + head + f\"\\nCOVER LETTER:\\n{letter}\")\n            log([j[\"company\"], j[\"title\"], j[\"apply_url\"], today, j[\"location\"], arrangement(j),\n                 j[\"source\"], j[\"score\"], \"Dry Run\", note])\n            record(j, \"Test run (not sent)\")\n        else:\n            manual_case(note, letter)\n        checkpoint(st, \"history\")\n\n    save_state(st)\n    print(f\"Done. applied={applied} manual={manual} evaluated={evals} DRY_RUN={DRY_RUN}\")\n\nif __name__ == \"__main__\":\n    if \"--test-telegram\" in sys.argv:\n        telegram(\"Test message from your Job Agent. Notifications are working.\", \"test\")\n    else:\n        main()\n", "applier.py": "\"\"\"Browser automation for submitting applications (Greenhouse, Lever and similar plain forms).\nIt never bypasses CAPTCHAs or security checks: it stops and returns 'manual' instead.\"\"\"\nimport os, re\nfrom playwright.sync_api import sync_playwright\n\nSUCCESS = re.compile(r\"thank you for (applying|your (application|interest))|application (has been|was) \"\n                     r\"(received|submitted|sent)|successfully (submitted|applied)|\"\n                     r\"we(?:'ve| have) received your application\", re.I)\nVERIFY = re.compile(r\"security code|verification code|verify your email|confirm your email|enter the code\", re.I)\n\nJS = r\"\"\"\n(el) => {\n  const clean = s => (s || '').replace(/\\s+/g, ' ').trim();\n  let label = el.getAttribute('aria-label') || '';\n  if (!label && el.id) { const l = document.querySelector('label[for=\"' + CSS.escape(el.id) + '\"]'); if (l) label = l.innerText; }\n  if (!label) { const l = el.closest('label'); if (l) label = l.innerText; }\n  if (!label) { const ids = el.getAttribute('aria-labelledby'); if (ids) { const n = document.getElementById(ids.split(' ')[0]); if (n) label = n.innerText; } }\n  const box = el.closest('fieldset, [role=group], [role=radiogroup], .field, .application-field, .application-question, .select, .text-input-wrapper, .input-wrapper');\n  let question = '';\n  if (box) { const q = box.querySelector('legend, label, .label, [class*=label]'); question = q ? q.innerText : box.innerText.slice(0, 200); }\n  if (!label) label = question;\n  if (!label) label = el.getAttribute('placeholder') || el.name || el.id || '';\n  const opts = el.tagName === 'SELECT' ? Array.from(el.options).map(o => clean(o.text)) : [];\n  const st = window.getComputedStyle(el);\n  const visible = st.display !== 'none' && st.visibility !== 'hidden' && el.getClientRects().length > 0;\n  return {tag: el.tagName.toLowerCase(), type: (el.getAttribute('type') || '').toLowerCase(),\n          role: el.getAttribute('role') || '', name: el.name || '', id: el.id || '',\n          label: clean(label), question: clean(question),\n          required: !!(el.required || el.getAttribute('aria-required') === 'true'),\n          visible: visible, options: opts, value: el.value || ''};\n}\n\"\"\"\n\ndef yn(v):\n    return None if v is None else ([\"yes\"] if v else [\"no\"])\n\ndef choice_for(q, prof):\n    l = q.lower()\n    if re.search(r\"authori[sz]ed|legally|eligible to work|right to work\", l): return yn(prof.get(\"work_authorization\"))\n    if re.search(r\"sponsor|visa\", l): return yn(prof.get(\"needs_sponsorship\"))\n    if re.search(r\"gender|race|ethnic|veteran|disabilit|hispanic|lgbt|pronoun|sexual\", l):\n        return [\"decline\", \"prefer not\", \"do not wish\", \"don't wish\", \"not to say\", \"not wish\"]\n    if re.search(r\"hear about|how did you find|how did you learn\", l): return [\"linkedin\", \"job board\", \"website\", \"online\", \"other\"]\n    if re.search(r\"\\bcountry\\b\", l) and \"code\" not in l: return [\"egypt\"]\n    if re.search(r\"consent|agree|acknowledge\", l): return [\"yes\", \"agree\", \"i agree\", \"accept\"]\n    return None\n\ndef pick_option(options, snippets):\n    for s in snippets:\n        for o in options:\n            ol = o.lower()\n            if ol.startswith(s) or (len(s) > 3 and s in ol):\n                return o\n    return None\n\ndef simple_value(label, prof, job):\n    l = label.lower()\n    egypt = any(k in (job.get(\"location\") or \"\").lower() for k in (\"egypt\", \"cairo\"))\n    salary = prof[\"salary_egypt\"] if egypt else prof[\"salary_abroad\"]\n    rules = [\n        (r\"first name|given name\", prof[\"first_name\"]),\n        (r\"last name|family name|surname\", prof[\"last_name\"]),\n        (r\"e-?mail\", prof[\"email\"]),\n        (r\"phone|mobile|telephone\", prof[\"phone\"]),\n        (r\"linkedin\", prof[\"linkedin\"]),\n        (r\"behance|portfolio|website|personal site|link to your work\", prof[\"portfolio\"]),\n        (r\"current (company|employer)|^employer\", prof[\"current_company\"]),\n        (r\"current (job )?title\", prof[\"current_title\"]),\n        (r\"salary|compensation|expected pay\", salary),\n        (r\"notice period|available from|availability|start date|when can you start\", prof[\"start_date\"]),\n        (r\"city|current location|where are you (based|located)|^location\", prof[\"location\"]),\n        (r\"^\\W*(full |legal )?name\\b|your name\", prof[\"full_name\"]),\n    ]\n    for pat, val in rules:\n        if re.search(pat, l):\n            return val\n    return None\n\ndef fill_form(target, prof, job, cover, cv_path, answer_fn):\n    unresolved, radios_done, cv_done = [], set(), False\n    controls = target.locator(\"input, textarea, select\")\n    for i in range(controls.count()):\n        el = controls.nth(i)\n        try:\n            info = el.evaluate(JS)\n        except Exception:\n            continue\n        t, tag = info[\"type\"], info[\"tag\"]\n        if t in (\"hidden\", \"submit\", \"button\", \"image\", \"reset\") or info[\"name\"].startswith(\"g-recaptcha\"):\n            continue\n        label = info[\"label\"] or info[\"name\"]\n        q = info[\"question\"] or label\n        req = info[\"required\"] or \"*\" in label or \"*\" in info[\"question\"]\n        l = label.lower()\n        try:\n            if t == \"file\":\n                if re.search(r\"cover\", l):\n                    if req: unresolved.append(label)\n                elif not cv_done:\n                    el.set_input_files(cv_path); cv_done = True\n                continue\n            if not info[\"visible\"]:\n                continue\n            if t == \"checkbox\":\n                if re.search(r\"agree|consent|acknowledge|privacy|terms|confirm|certify\", (label + \" \" + q).lower()):\n                    el.check()\n                elif req:\n                    unresolved.append(label)\n                continue\n            if t == \"radio\":\n                group = info[\"name\"] or info[\"id\"]\n                if group in radios_done: continue\n                radios_done.add(group)\n                ch = choice_for(q, prof)\n                chosen = False\n                if ch:\n                    radios = target.locator(f'input[type=\"radio\"][name=\"{group}\"]')\n                    labels = [(radios.nth(k), radios.nth(k).evaluate(JS)[\"label\"]) for k in range(radios.count())]\n                    opt = pick_option([lb for _, lb in labels], ch)\n                    for rel, lb in labels:\n                        if lb == opt:\n                            rel.check(); chosen = True; break\n                if not chosen and (req or \"*\" in q):\n                    unresolved.append(q)\n                continue\n            if tag == \"select\":\n                ch = choice_for(q, prof)\n                opt = pick_option(info[\"options\"], ch) if ch else None\n                if opt: el.select_option(label=opt)\n                elif req: unresolved.append(label)\n                continue\n            if info[\"value\"] and t not in (\"file\",):\n                continue  # already prefilled\n            val = simple_value(label, prof, job)\n            if info[\"role\"] == \"combobox\":\n                ch = choice_for(q, prof)\n                text = (ch[0] if ch else val)\n                if text:\n                    el.click(); el.fill(text); target.wait_for_timeout(700); el.press(\"Enter\")\n                elif req:\n                    unresolved.append(label)\n                continue\n            if val:\n                el.fill(val); continue\n            if tag == \"textarea\" and re.search(r\"cover letter|additional information|comments|message to|why (are you|do you)\", l):\n                el.fill(cover); continue\n            if req:\n                ans = answer_fn(label)\n                if ans: el.fill(ans)\n                else: unresolved.append(label)\n        except Exception as e:\n            if req: unresolved.append(f\"{label} ({type(e).__name__})\")\n    if not cv_done:\n        unresolved.append(\"Resume upload field not found\")\n    return unresolved\n\ndef captcha_visible(page):\n    try:\n        return page.locator('iframe[src*=\"hcaptcha.com\"], iframe[src*=\"recaptcha/api2/bframe\"], '\n                            '.h-captcha, .g-recaptcha[data-size!=\"invisible\"]').first.is_visible()\n    except Exception:\n        return False\n\ndef find_form(page):\n    for fr in page.frames:\n        try:\n            if fr.locator('input[type=\"email\"], input[name=\"email\"], input[id=\"email\"]').count():\n                return fr\n        except Exception:\n            pass\n    return None\n\ndef body_text(page):\n    out = []\n    for fr in page.frames:\n        try: out.append(fr.locator(\"body\").inner_text(timeout=2000))\n        except Exception: pass\n    return \"\\n\".join(out)\n\ndef apply_to_job(job, prof, cv_path, cover, answer_fn, dry_run, shot_dir):\n    \"\"\"Returns (status, note). status: 'submitted' | 'dry_run' | 'manual'.\"\"\"\n    url = job[\"apply_url\"]\n    if \"jobs.lever.co\" in url and not url.rstrip(\"/\").endswith(\"/apply\"):\n        url = url.rstrip(\"/\") + \"/apply\"\n    os.makedirs(shot_dir, exist_ok=True)\n    slug = re.sub(r\"\\W+\", \"-\", f\"{job['company']}-{job['title']}\")[:60]\n    with sync_playwright() as p:\n        browser = p.chromium.launch(headless=True)\n        try:\n            page = browser.new_context(viewport={\"width\": 1280, \"height\": 2000}, locale=\"en-US\").new_page()\n            page.goto(url, wait_until=\"domcontentloaded\", timeout=45000)\n            page.wait_for_timeout(4000)\n            target = find_form(page)\n            if not target:\n                for sel in ['a:has-text(\"Apply\")', 'button:has-text(\"Apply\")']:\n                    try:\n                        page.locator(sel).first.click(timeout=3000); page.wait_for_timeout(3000)\n                        target = find_form(page)\n                        if target: break\n                    except Exception:\n                        pass\n            if not target:\n                return \"manual\", \"Application form not found (login or custom flow)\"\n            if captcha_visible(page):\n                return \"manual\", \"CAPTCHA challenge present\"\n            unresolved = fill_form(target, prof, job, cover, cv_path, lambda lb: answer_fn(lb, job))\n            page.screenshot(path=os.path.join(shot_dir, slug + \"-filled.png\"), full_page=True)\n            if unresolved:\n                return \"manual\", \"Could not answer: \" + \"; \".join(unresolved[:6])\n            if dry_run:\n                return \"dry_run\", \"Form filled; not submitted (dry run)\"\n            btn = target.locator('button[type=\"submit\"], input[type=\"submit\"], button:has-text(\"Submit\")').first\n            btn.click(timeout=8000)\n            for _ in range(20):\n                page.wait_for_timeout(1000)\n                txt = body_text(page)\n                if SUCCESS.search(txt) or re.search(r\"confirm|thank\", page.url, re.I):\n                    page.screenshot(path=os.path.join(shot_dir, slug + \"-done.png\"), full_page=True)\n                    return \"submitted\", \"Confirmation page detected\"\n                if VERIFY.search(txt):\n                    return \"manual\", \"Email verification code required. Open the job link and finish it\"\n                if captcha_visible(page):\n                    return \"manual\", \"CAPTCHA appeared on submit\"\n            page.screenshot(path=os.path.join(shot_dir, slug + \"-unclear.png\"), full_page=True)\n            return \"manual\", \"No confirmation detected. It may or may not have gone through: check your email\"\n        except Exception as e:\n            return \"manual\", f\"Automation error: {type(e).__name__}: {str(e)[:120]}\"\n        finally:\n            browser.close()\n", "gate.py": "\"\"\"Decides whether this hourly run should do anything (reads the dashboard's settings). Standard library only.\"\"\"\nimport json, os\nfrom datetime import datetime, timezone\ndef load(n):\n    try: return json.load(open(n, encoding=\"utf-8\"))\n    except Exception: return {}\nS, T = load(\"settings.json\"), load(\"stats.json\")\naction, event = os.getenv(\"ACTION\") or \"run\", os.getenv(\"EVENT\", \"\")\nrun, why = True, \"\"\nif action == \"test_telegram\": pass\nelif S.get(\"status\", \"stopped\") != \"running\": run, why = False, \"paused or stopped\"\nelif event == \"schedule\" and T.get(\"last_run\"):\n    hrs = (datetime.now(timezone.utc) - datetime.fromisoformat(T[\"last_run\"])).total_seconds() / 3600\n    if hrs < S.get(\"frequency_hours\", 1) - 0.2: run, why = False, \"not due yet\"\nprint(f\"run={run} {why}\")\nopen(os.environ[\"GITHUB_OUTPUT\"], \"a\").write(f\"run={'true' if run else 'false'}\\n\")\n", "requirements.txt": "playwright==1.48.0\n", "companies.json": "{\n  \"_note\": \"Add company board tokens here. Greenhouse: boards.greenhouse.io/<token>. Lever: jobs.lever.co/<token>. Unknown tokens are skipped silently. The ones below are examples; replace them with companies you want to target.\",\n  \"greenhouse\": [\"gitlab\", \"webflow\", \"mozilla\"],\n  \"lever\": []\n}\n", ".github/workflows/job-agent.yml": "name: Job Agent\n\non:\n  schedule:\n    - cron: \"17 * * * *\"      # hourly, 24/7 (minute 17 avoids the busy top-of-hour queue)\n  workflow_dispatch:\n    inputs:\n      action:\n        description: run or test_telegram\n        default: run\n\npermissions:\n  contents: write\n\n# Never run two at once. A new run waits for the current one instead of overlapping it.\nconcurrency:\n  group: job-agent\n  cancel-in-progress: false\n\njobs:\n  run:\n    runs-on: ubuntu-latest\n    timeout-minutes: 50\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Check dashboard settings\n        id: gate\n        env:\n          ACTION: ${{ github.event.inputs.action }}\n          EVENT: ${{ github.event_name }}\n        run: python3 gate.py\n\n      - if: steps.gate.outputs.run == 'true'\n        uses: actions/setup-python@v5\n        with:\n          python-version: \"3.12\"\n          cache: pip\n\n      - name: Install Python dependencies\n        if: steps.gate.outputs.run == 'true'\n        run: pip install -r requirements.txt\n\n      - name: Cache browser\n        if: steps.gate.outputs.run == 'true'\n        uses: actions/cache@v4\n        with:\n          path: ~/.cache/ms-playwright\n          key: playwright-${{ hashFiles('requirements.txt') }}\n\n      - name: Git identity (the agent saves history after every application)\n        if: steps.gate.outputs.run == 'true'\n        run: |\n          git config user.name \"job-agent\"\n          git config user.email \"job-agent@users.noreply.github.com\"\n\n      - name: Run job agent\n        if: steps.gate.outputs.run == 'true'\n        env:\n          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}\n          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}\n          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}\n          ACTION: ${{ github.event.inputs.action }}\n        run: |\n          if [ \"$ACTION\" = \"test_telegram\" ]; then python job_agent.py --test-telegram; else python job_agent.py; fi\n\n      - name: Keep screenshots for review\n        if: always() && steps.gate.outputs.run == 'true'\n        uses: actions/upload-artifact@v4\n        with:\n          name: screenshots\n          path: screenshots/\n          if-no-files-found: ignore\n          retention-days: 7\n\n      - name: Final history save\n        if: always() && steps.gate.outputs.run == 'true'\n        run: |\n          git add seen.json applications_log.csv jobs_log.json stats.json || true\n          git diff --cached --quiet || git commit -m \"Update application history\"\n          git pull --rebase --autostash || true\n          git push || true\n\n      - name: Telegram alert if the run failed\n        if: failure()\n        env:\n          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}\n          C: ${{ secrets.TELEGRAM_CHAT_ID }}\n        run: |\n          curl -s -X POST \"https://api.telegram.org/bot$T/sendMessage\" \\\n            -d chat_id=\"$C\" \\\n            -d text=\"Job agent run FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"\n"};

async function connect(){repo=$("#repo").value.trim();token=$("#tok").value.trim();localStorage.ja_repo=repo;localStorage.ja_token=token;try{const i=await gh(`/repos/${repo}`);if(!i.permissions?.push)return toast("Connected, but the access code can only read. Give it Read and write permissions.","wa");branch=i.default_branch;toast("Connected to "+i.full_name);loadAll()}catch(e){toast(friendly(e),"er")}}
async function install(){try{for(const[p,c]of Object.entries(FILES))await putF(p,c,"Install agent");toast("Agent installed. Continue with step 3.")}catch(e){toast(friendly(e),"er")}}
async function secret(n,v){const k=await gh(`/repos/${repo}/actions/secrets/public-key`);await sodium.ready;const e=sodium.crypto_box_seal(sodium.from_string(v),sodium.from_base64(k.key,sodium.base64_variants.ORIGINAL));
await gh(`/repos/${repo}/actions/secrets/${n}`,{method:"PUT",body:JSON.stringify({encrypted_value:sodium.to_base64(e,sodium.base64_variants.ORIGINAL),key_id:k.key_id})})}
async function saveKeys(){if(typeof sodium=="undefined")return toast("Encryption tool didn't load. Check your internet and reload the page.","er");
try{let n=0;for(const[id,name]of[["tt","TELEGRAM_BOT_TOKEN"],["tc","TELEGRAM_CHAT_ID"],["ak","ANTHROPIC_API_KEY"]]){const v=$("#"+id).value.trim();if(v){await secret(name,v);n++}}n?toast(n+" key(s) saved securely"):toast("Nothing to save: all boxes were empty.","wa")}catch(e){toast(friendly(e),"er")}}
const tg=async(m,t,p)=>(await fetch(`https://api.telegram.org/bot${t}/${m}?`+new URLSearchParams(p))).json();
async function findChat(){const t=$("#tt").value.trim();if(!t)return toast("Paste the bot token first.","wa");try{const r=await tg("getUpdates",t,{});const m=(r.result||[]).reverse().find(x=>x.message);
if(!m)return toast("No message found. Send any message to your bot in Telegram, then try again.","wa");$("#tc").value=m.message.chat.id;await tg("sendMessage",t,{chat_id:m.message.chat.id,text:"Connected! Your Job Agent can now message you here."});toast("Found it, and sent you a hello.")}catch(e){toast("Telegram didn't answer. Check the token.","er")}}
async function dispatch(a){await gh(`/repos/${repo}/actions/workflows/job-agent.yml/dispatches`,{method:"POST",body:JSON.stringify({ref:branch,inputs:{action:a}})})}
async function runNow(){if(S.status!="running")return toast("Press Start first. The agent is "+S.status+".","wa");try{await dispatch("run");toast("Search started. Results appear in a few minutes.")}catch(e){toast(friendly(e),"er")}}
async function testTelegram(){try{await dispatch("test_telegram");toast("Test message requested. It should arrive within a minute.")}catch(e){toast(friendly(e),"er")}}
async function setStatus(s){try{S.status=s;await putF("settings.json",JSON.stringify(S,null,2),"Agent "+s);
if(s=="stopped")await gh(`/repos/${repo}/actions/workflows/job-agent.yml/disable`,{method:"PUT"}).catch(()=>{});else await gh(`/repos/${repo}/actions/workflows/job-agent.yml/enable`,{method:"PUT"}).catch(()=>{});
toast("Agent "+{running:"started",paused:"paused",stopped:"stopped"}[s]);render()}catch(e){toast(friendly(e),"er")}}
async function setMode(m){if(m=="live"&&!confirm("Go Live?\n\nThe agent will SUBMIT real applications to employers using your CV and the cover letters it writes, up to "+S.max_apply_per_day+" a day. You can pause it any time.\n\nYour approval is needed only here."))return;
try{S.mode=m;await putF("settings.json",JSON.stringify(S,null,2),"Mode "+m);toast(m=="live"?"Live mode on":"Back to Test mode");render()}catch(e){toast(friendly(e),"er")}}
async function finish(){if(!ready&&!(await getF("settings.json")))try{await putF("settings.json",JSON.stringify(S,null,2),"Initial settings")}catch(e){return toast(friendly(e),"er")}
if(!PR.email)return toast("Fill in your profile and upload your CV first (step 4).","wa");try{await putF("profile.json",JSON.stringify(PR,null,2));await setStatus("running");await dispatch("run");toast("Started in Test mode. Watch Overview.");go("overview");loadAll()}catch(e){toast(friendly(e),"er")}}
loadAll();setInterval(()=>{if(ready&&!document.activeElement.matches("input,textarea,select"))loadAll()},60000);
</script></body></html>
